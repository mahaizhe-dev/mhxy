name: Import item assets

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Tarball URL containing assets/items
        required: true
      sha256:
        description: Expected sha256 of the tarball
        required: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify tarball
        env:
          SRC_URL: ${{ inputs.source_url }}
          WANT_SHA: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/items.tar.gz "$SRC_URL"
          echo "$WANT_SHA  /tmp/items.tar.gz" | sha256sum -c -
          ls -l /tmp/items.tar.gz

      - name: Extract into assets/items
        run: |
          set -euo pipefail
          rm -rf /tmp/unpack && mkdir -p /tmp/unpack
          tar -xzf /tmp/items.tar.gz -C /tmp/unpack
          test -d /tmp/unpack/assets/items
          mkdir -p assets/items
          cp -a /tmp/unpack/assets/items/. assets/items/
          echo "file count: $(find assets/items -type f | wc -l)"
          find assets/items -type f -exec sha256sum {} + | sort -k2

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/items
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add public item icon assets (exact source binaries)"
            git push
          fi
