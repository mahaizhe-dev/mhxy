name: Deploy public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified public snapshot
        shell: bash
        run: |
          cat $(printf '_snapshot_upload/part%02d.txt ' {0..10}) | base64 --decode | gzip --decompress > snapshot.9e2adf57f09de4f0.json
          echo "b2c2584334b10971b0777d2da123a633606f9ec474192b6c6c41a5109682fe12  snapshot.9e2adf57f09de4f0.json" | sha256sum --check
          python -m json.tool snapshot.9e2adf57f09de4f0.json > /dev/null
          rm -rf _snapshot_upload
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
