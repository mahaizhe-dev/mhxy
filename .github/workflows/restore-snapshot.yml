name: Restore verified snapshot
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify snapshot
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json
          encoded = ''.join((Path('_snapshot_upload') / f'part{i:02d}.txt').read_text().strip() for i in range(11))
          compressed = base64.b64decode(encoded)
          raw = gzip.decompress(compressed)
          print('encoded', len(encoded), 'compressed', len(compressed), 'raw', len(raw), 'sha256', hashlib.sha256(raw).hexdigest())
          json.loads(raw.decode('utf-8'))
          Path('snapshot.9e2adf57f09de4f0.json').write_bytes(raw)
          PY
          rm -rf _snapshot_upload
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore verified public snapshot and clean upload parts"
          git push
