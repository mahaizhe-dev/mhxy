name: Publish bundle

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Bundle tarball URL
        required: true
      sha256:
        description: Expected sha256 of the tarball
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and verify bundle
        env:
          SRC_URL: ${{ inputs.source_url }}
          WANT_SHA: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/bundle.tar.gz "$SRC_URL"
          echo "$WANT_SHA  /tmp/bundle.tar.gz" | sha256sum -c -

      - name: Sync public bundle
        run: |
          set -euo pipefail
          rm -rf /tmp/unpack && mkdir -p /tmp/unpack
          tar -xzf /tmp/bundle.tar.gz -C /tmp/unpack
          test -f /tmp/unpack/index.html
          test -d /tmp/unpack/assets/items
          rm -f snapshot.*.json app-*.bin snapshot-*.bin styles.css.gz
          rm -rf assets
          cp -a /tmp/unpack/. .
          echo "--- published files ---"
          ls -1
          echo "asset count: $(find assets/items -type f | wc -l)"

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Republish public bundle from current data"
            git push
          fi
